version: "3.8"

# =====================================================
# E2E Sandbox — Isolated from prod containers
# Ports: Postgres=5433, Qdrant=6334, Redis=6380
# =====================================================

services:
  postgres-e2e:
    image: postgres:15-alpine
    container_name: gov-e2e-postgres
    environment:
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_pass
      POSTGRES_DB: gov_chat_e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U e2e_user -d gov_chat_e2e" ]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant-e2e:
    image: qdrant/qdrant:v1.10.1
    container_name: gov-e2e-qdrant
    ports:
      - "6334:6333"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:6333/healthz || true" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-e2e:
    image: redis:7-alpine
    container_name: gov-e2e-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
