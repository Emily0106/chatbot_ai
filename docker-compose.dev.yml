version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gov-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d test" ]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: gov-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio
    container_name: gov-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:alpine
    container_name: gov-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: gov-backend
    environment:
      - DB_URL=postgresql+asyncpg://test:test@postgres:5432/test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test
      - POSTGRES_HOST=postgres
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - EMBEDDING_DEVICE=cuda
      - RERANK_DEVICE=cuda
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock}
      - QDRANT_READONLY_API_KEY=mock_key
      - EMBED_MODEL_PATH=sentence-transformers/all-MiniLM-L6-v2
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=ingestion
      - STORAGE_BACKEND=s3
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend/src:/app/src
      - ./libs/core_shared:/app/libs/core_shared
    depends_on:
      - postgres
      - qdrant
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ingestion-api:
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile.gpu
    container_name: gov-ingest-api
    environment:
      - DATABASE_URL=postgresql://test:test@postgres:5432/test
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=gov_knowledge
      - REDIS_URL=redis://redis:6379
      - INGEST_LANE=auto
      - EMBED_MODEL_PATH=/models/vietnamese-sbert
      - EMBED_DEVICE=cuda
      - DOCLING_ARTIFACTS_PATH=/models/docling
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=ingestion
      - STORAGE_BACKEND=s3
    ports:
      - "8010:8010"
    volumes:
      - ./apps/ingestion/src:/app/src
      - ./libs/core_shared:/app/libs/core_shared
      - /tmp/ai_chat_storage:/tmp/ai_chat_storage
      - ./models:/models:ro
      - ./storage/raw_files:/app/storage
    depends_on:
      - postgres
      - qdrant
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ingestion-worker:
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile.gpu
    container_name: gov-ingest-worker
    command: celery -A app.workers.worker_main worker --loglevel=info --concurrency=1
    environment:
      - DATABASE_URL=postgresql://test:test@postgres:5432/test
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=gov_knowledge
      - REDIS_URL=redis://redis:6379
      - INGEST_LANE=auto
      - EMBED_MODEL_PATH=/models/vietnamese-sbert
      - EMBED_DEVICE=cuda
      - DOCLING_ARTIFACTS_PATH=/models/docling
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=ingestion
      - STORAGE_BACKEND=s3
    volumes:
      - ./apps/ingestion/src:/app/src
      - ./libs/core_shared:/app/libs/core_shared
      - /tmp/ai_chat_storage:/tmp/ai_chat_storage
      - ./models:/models:ro
      - ./storage/raw_files:/app/storage
    depends_on:
      - postgres
      - qdrant
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
