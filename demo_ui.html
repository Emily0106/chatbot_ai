<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gov-AI Citizen Agent Demo</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --chat-bg: #ffffff;
            --user-msg: #eff6ff;
            --bot-msg: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            background: var(--user-msg);
            color: var(--primary);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .message.bot {
            background: var(--bot-msg);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        .message.error {
            background: #fef2f2;
            color: #ef4444;
            align-self: flex-start;
        }

        .citations {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
        }

        .citation-item {
            display: block;
            margin-bottom: 4px;
        }

        .citation-item a {
            color: var(--primary);
            text-decoration: none;
        }

        .citation-item a:hover {
            text-decoration: underline;
        }

        #input-area {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* Loading Dots */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
    <!-- Use marked to render markdown gracefully -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <div id="app">
        <header>Trợ lý Công dân (Citizen Agent)</header>

        <div id="chat-window">
            <div class="message bot">
                Xin chào! Tôi là Trợ lý Công dân. Tôi có thể giúp bạn tra cứu thủ tục hành chính, pháp luật, và tải biểu
                mẫu. Hãy đặt câu hỏi nhé!
            </div>
        </div>

        <form id="input-area" onsubmit="sendMessage(event)">
            <input type="text" id="user-input" placeholder="Ví dụ: Hướng dẫn đăng ký kết hôn, hoặc tải mẫu đơn..."
                autocomplete="off">
            <button type="submit" id="send-btn">Gửi</button>
        </form>
    </div>

    <script>
        // URL của Backend API (FastAPI)
        const API_URL = "http://localhost:8000/api/chat";

        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        async function sendMessage(event) {
            event.preventDefault();

            const text = userInput.value.trim();
            if (!text) return;

            // 1. Hiển thị tin nhắn User
            appendMessage('user', text);
            userInput.value = '';

            // 2. Hiển thị Loading
            const loadingId = appendLoading();
            setLoadingState(true);

            try {
                // 3. Gọi API Backend
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-Key": "dev-key-123"
                        // Bạn có thể thêm Auth headers ở đây nếu Backend yêu cầu
                    },
                    body: JSON.stringify({
                        tenant_id: "demo_tenant", // Mock tenant
                        agent_id: "citizen_agent", // Bắt buộc trỏ đúng Agent mình vừa code
                        message: text,
                        stream: false,
                        filters: {}, // Có thể truyền geo_code vào đây nếu cần
                        context: {
                            geo_code: "vn_01",
                            department_id: "dept_demo"
                        }
                    })
                });

                removeMessage(loadingId);

                if (!response.ok) {
                    const errData = await response.json();
                    let errMsg = errData.detail;
                    if (typeof errData.detail === 'object') {
                        errMsg = JSON.stringify(errData.detail, null, 2);
                    }
                    throw new Error(errMsg || `Lỗi HTTP: ${response.status}`);
                }

                const data = await response.json();

                // 4. Hiển thị câu trả lời (bot)
                appendMessage('bot', data.answer, data.citations);

            } catch (error) {
                removeMessage(loadingId);
                appendMessage('error', `Lỗi: Không thể kết nối tới server. Chi tiết: ${error.message}. <br><br><b>Lưu ý:</b> Hãy đảm bảo bạn đã chạy backend (<code>uvicorn app.main:app --reload</code>).`);
                console.error(error);
            } finally {
                setLoadingState(false);
                userInput.focus();
            }
        }

        function appendMessage(role, content, citations = []) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            // Dùng marked library để render markdown (in đậm, in nghiêng, list, link)
            let htmlContent = role === 'user' ? content : marked.parse(content);

            // Thêm Citations nếu có
            if (citations && citations.length > 0) {
                htmlContent += `<div class="citations"><b>Trích dẫn:</b>`;
                citations.forEach((c, idx) => {
                    const title = c.title || `Tài liệu ${idx + 1}`;
                    const url = c.file_url || '#';
                    htmlContent += `<span class="citation-item">[${idx + 1}] <a href="${url}" target="_blank">${title}</a></span>`;
                });
                htmlContent += `</div>`;
            }

            msgDiv.innerHTML = htmlContent;
            chatWindow.appendChild(msgDiv);
            scrollToBottom();
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            msgDiv.id = id;
            msgDiv.innerHTML = `
            <div class="typing-indicator">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        `;
            chatWindow.appendChild(msgDiv);
            scrollToBottom();
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function setLoadingState(isLoading) {
            userInput.disabled = isLoading;
            sendBtn.disabled = isLoading;
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>

</body>

</html>
