
worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;

    # Basic Auth File Mapped from Secret
    # /etc/nginx/secrets/htpasswd

    # Server: HTTP Redirect
    server {
        listen 8080;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    # Server: HTTPS Edge
    server {
        listen 8443 ssl;
        server_name localhost;

        # TLS Config
        ssl_certificate /etc/nginx/secrets/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/secrets/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer;

        # Health / Root
        location / {
            return 200 "Gov-AI Edge Gateway (Secure) OK";
        }

        # 1. API - Public / Proxy
        location /api/ {
            proxy_pass http://gov-ai-backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # SSE Support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # 2. Metrics - PROMETHEUS ONLY (Strict)
        location /metrics {
            auth_basic "Prometheus Scrape Area";
            auth_basic_user_file /etc/nginx/secrets/htpasswd;
            
            proxy_pass http://gov-ai-backend:8000/metrics;
        }

        # 3. Observability UI - PROTECTED
        
        # Grafana
        location /grafana/ {
            auth_basic "Ops Admin Area";
            auth_basic_user_file /etc/nginx/secrets/htpasswd;
            
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
        }

        # Prometheus UI
        location /prometheus/ {
            auth_basic "Ops Admin Area";
            auth_basic_user_file /etc/nginx/secrets/htpasswd;
            
            proxy_pass http://prometheus:9090/;
        }

        # Alertmanager UI
        location /alertmanager/ {
            auth_basic "Ops Admin Area";
            auth_basic_user_file /etc/nginx/secrets/htpasswd;
            
            proxy_pass http://alertmanager:9093/;
        }
    }
}
