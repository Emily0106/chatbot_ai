version: "3.8"

services:
  # --- Core Application ---
  backend:
    container_name: gov-ai-backend
    # In production, use a specific version tag from registry
    # image: ghcr.io/org/gov-ai-backend:v1.2.0
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    env_file:
      - env/.env.backend.prod
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - gov-ai-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G

  # --- Edge Gateway ---
  nginx-edge:
    image: nginx:alpine
    container_name: gov-ai-edge
    ports:
      - "80:8080"   # Exposed on standard HTTP port
      - "443:8443"  # Exposed on standard HTTPS port
    env_file:
      - env/.env.edge.prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/htpasswd:/etc/nginx/secrets/htpasswd:ro
      - ./secrets/tls:/etc/nginx/secrets/tls:ro
    networks:
      - gov-ai-net
    depends_on:
      - backend
      - prometheus
      - grafana
      - alertmanager
    restart: always

  # --- Observability Stack ---
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: gov-ai-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - gov-ai-net
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: gov-ai-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.config
    command:
      - "--config.file=/etc/alertmanager/alertmanager.config"
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - gov-ai-net
    restart: always

  grafana:
    image: grafana/grafana:10.0.3
    container_name: gov-ai-grafana
    env_file:
      - env/.env.observability.prod
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_SERVER_ROOT_URL=https://gov-ai.example.com/grafana/
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana/dashboards
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
    networks:
      - gov-ai-net
    restart: always

networks:
  gov-ai-net:
    driver: bridge
