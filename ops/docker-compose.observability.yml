version: "3.8"

services:
  nginx-edge:
    image: nginx:alpine
    container_name: gov-ai-edge
    ports:
      - "8080:8080" # Redirect
      - "8443:8443" # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Secrets mounted separately
      - ./secrets/htpasswd:/etc/nginx/secrets/htpasswd:ro
      - ./secrets/tls:/etc/nginx/secrets/tls:ro
    networks:
      - gov-ai-net
    depends_on:
      - prometheus
      - grafana
      - alertmanager

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: gov-ai-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - gov-ai-net

  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: gov-ai-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.config
    command:
      - "--config.file=/etc/alertmanager/alertmanager.config"
    ports:
      - "9093:9093"
    networks:
      - gov-ai-net

  grafana:
    image: grafana/grafana:10.0.3
    container_name: gov-ai-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Read password from secret file
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana/dashboards
      # Mount secret for Grafana
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
    networks:
      - gov-ai-net

networks:
  gov-ai-net:
    driver: bridge
