
route:
  group_by: ['alertname', 'service', 'env']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 2h
  
  receiver: 'ops-warning' # Default

  routes:
    - match:
        severity: critical
      receiver: 'ops-critical'
    - match:
        severity: warning
      receiver: 'ops-warning'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service', 'env']

receivers:
  - name: 'ops-critical'
    webhook_configs:
      - url: 'http://webhook-receiver:9000/critical' # Mock target for CI/Testing
        send_resolved: true

  - name: 'ops-warning'
    webhook_configs:
      - url: 'http://webhook-receiver:9000/warning'
        send_resolved: true
