global:
  scrape_interval: 5s


alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "gov-ai-backend"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    basic_auth:
      username: "admin"
      password: "admin"
    static_configs:
      - targets: ["nginx-edge:8443"]
      # - targets: ["gov-ai-backend:8000"] # Direct access (bypass edge)
