<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gov Chat Test</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        #chat-box {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
        }

        .user {
            background-color: #e3f2fd;
            text-align: right;
        }

        .bot {
            background-color: #f1f8e9;
            text-align: left;
            white-space: pre-wrap;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1976d2;
        }

        .citation {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <h1>AI Gov Chat Test</h1>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="message-input" placeholder="Nhập câu hỏi (ví dụ: Tìm thông tin ông Nguyễn Văn A)..."
            onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/chat';

        function appendMessage(text, sender, citations = []) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;

            if (citations && citations.length > 0) {
                const citDiv = document.createElement('div');
                citDiv.className = 'citation';
                citDiv.innerHTML = '<b>Nguồn:</b><br>' + citations.map(c =>
                    `- ${c.snippet} (Score: ${c.score.toFixed(2)})`
                ).join('<br>');
                div.appendChild(citDiv);
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            input.value = '';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        agent_id: 'agri_agent',
                        tenant_id: 'default',
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                appendMessage(data.answer, 'bot', data.citations);
            } catch (error) {
                console.error('Error:', error);
                appendMessage('Lỗi kết nối đến server: ' + error.message, 'bot');
            }
        }
    </script>
</body>

</html>
